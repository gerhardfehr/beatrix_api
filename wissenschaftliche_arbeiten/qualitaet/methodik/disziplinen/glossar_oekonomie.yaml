  meta_analyse:
    E: 0.88
    bedingung: "Gut durchgeführt, präregistriert"

  rct_praeregistriert:
    E: 0.82
    bedingung: "Pre-Analysis Plan, adequate power"

  rct_nicht_praeregistriert:
    E: 0.70
    bedingung: "Potentielles P-Hacking"

  natural_experiment:
    E: 0.68
    bedingung: "Plausible exogene Variation"

  instrumentvariable:
    E: 0.60
    bedingung: "Starkes Instrument, plausible Exogenität"

  diff_in_diff:
    E: 0.62
    bedingung: "Parallele Trends plausibel"

  regression_discontinuity:
    E: 0.72
    bedingung: "Keine Manipulation am Cutoff"

  ols_observational:
    E: 0.45
    bedingung: "Korrelation, nicht Kausalität"

  theorie_kalibriert:
    E: 0.55
