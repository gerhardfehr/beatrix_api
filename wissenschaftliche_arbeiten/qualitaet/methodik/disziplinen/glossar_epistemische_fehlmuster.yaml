      status: "Widerlegt"
      evidenz:
        - "Keine Wirkung über Placebo in Meta-Analysen"
        - "Physikalisch unmöglich (keine Moleküle ab C12)"
        - "Wassergedächtnis widerlegt"
        - "Cochrane Reviews: keine Evidenz"
      konsens: "Wissenschaftlich nicht plausibel, nicht wirksam"
    verwendete_muster:
      - "Anekdotische Evidenz"
      - "Naturalistischer Fehlschluss"
      - "Wissenschafts-Mimikry"
    konfidenz_widerlegung: 0.98

  astrologie:
