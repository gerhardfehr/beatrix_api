        - "Thermit-Behauptungen widerlegt"
        - "Tausende müssten schweigen"
        - "Al-Qaida bekannte sich"
      konsens: "Wissenschaftlich-technisch erklärt"
    verwendete_muster:
      - "Anomalie-Jagd (WTC7)"
      - "JAQing (Just Asking Questions)"
      - "Proportionalitätsbias"
