        - "HSCA 1979: Wahrscheinlich Verschwörung (umstrittene Akustik)"
        - "Ballistische Analysen unterstützen Einzeltäter"
        - "Keine harten Beweise für Zweitschützen"
      konsens: "Mainstream-Historiker: Einzeltäter wahrscheinlicher"
    verwendete_muster:
      - "Proportionalitätsbias"
      - "Anomalie-Jagd"
      - "Cui bono"
    konfidenz_widerlegung: 0.70
    anmerkung: "Komplexerer Fall als andere VT"

  9_11_inside_job:
    behauptung: "9/11 war ein Inside Job"
    wissenschaftliche_lage:
      status: "Widerlegt"
      evidenz:
        - "Ingenieurskonsens: Kollaps durch Feuer/Aufprall erklärbar"
