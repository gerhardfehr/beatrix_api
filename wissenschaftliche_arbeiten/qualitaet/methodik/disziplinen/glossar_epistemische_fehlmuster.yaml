      status: "Demographisch widerlegt"
      probleme:
        - "Migration folgt ökonomischen/politischen Faktoren"
        - "Keine zentrale Planung nachweisbar"
        - "Geburtenraten sind individuelle Entscheidungen"
        - "Führte zu terroristischer Gewalt"
      konsens: "Demographische Veränderungen ≠ 'Plan'"
    verwendete_muster:
      - "Intentionalisierung von Prozessen"
      - "In-/Outgroup"
      - "Cui bono"
    konfidenz_gegen: 0.98


