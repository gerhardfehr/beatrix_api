        - "Basiert auf anonymen Internetposts"
        - "Recycelt antisemitische Blutlügen-Tropen"
        - "Führte zu realer Gewalt"
      konsens: "Psychologisch gut verstandenes Phänomen"
    verwendete_muster:
      - "Kryptische Prophezeiungen"
      - "Moving Goalposts"
      - "Ingroup/Outgroup"
    konfidenz_gegen: 0.99

  great_replacement:
    behauptung: "Geplanter Bevölkerungsaustausch durch Eliten"
