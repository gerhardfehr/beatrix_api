# =============================================================================
# TYPISCHE SATZSTRUKTUREN
# =============================================================================

satzstrukturen:

  kausal_stark:
    muster: "X verursacht Y"
    B_wert: 0.95
    beispiel: "Die Mindestlohnerhöhung verursacht Beschäftigungsverluste."
    warnung: "Nur bei experimenteller Evidenz angemessen"

  kausal_moderat:
    muster: "X führt zu Y"
    B_wert: 0.80
    beispiel: "Handelsliberalisierung führt zu Effizienzgewinnen."

  korrelativ:
    muster: "X ist assoziiert mit Y"
    B_wert: 0.50
    beispiel: "Bildung ist assoziiert mit höherem Einkommen."

  theoretisch:
    muster: "Im Modell impliziert X Y"
    B_wert: 0.40
    beispiel: "Im Modell impliziert Risikoaversion eine konkave Nutzenfunktion."

  hypothetisch:
    muster: "X könnte Y beeinflussen"
    B_wert: 0.30
    beispiel: "Geldpolitik könnte langfristig neutral sein."
