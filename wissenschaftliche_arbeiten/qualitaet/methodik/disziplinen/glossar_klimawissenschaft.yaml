# =============================================================================
# ESL GLOSSAR: Klimawissenschaft
# =============================================================================
# Definitionen mit IPCC-Konfidenz und wissenschaftlichem Konsens
# Version: 1.0
# =============================================================================

meta:
  disziplin: "Klimawissenschaft"
  anzahl_eintraege: 52
  beschreibung: |
    Glossar klimawissenschaftlicher Begriffe mit IPCC-Terminologie.
    Verwendet standardisierte Konfidenzangaben (virtually certain,
    very likely, likely, etc.) und Konsenslevel aus AR6.


# =============================================================================
# IPCC KONFIDENZ-TERMINOLOGIE
# =============================================================================

ipcc_konfidenz:

  wahrscheinlichkeits_begriffe:
    beschreibung: "Standardisierte Wahrscheinlichkeitsangaben des IPCC"
    stufen:
      virtually_certain:
        deutsch: "praktisch sicher"
        wahrscheinlichkeit: "99-100%"
      extremely_likely:
        deutsch: "äußerst wahrscheinlich"
        wahrscheinlichkeit: "95-100%"
      very_likely:
        deutsch: "sehr wahrscheinlich"
        wahrscheinlichkeit: "90-100%"
      likely:
        deutsch: "wahrscheinlich"
        wahrscheinlichkeit: "66-100%"
      about_as_likely_as_not:
        deutsch: "etwa gleich wahrscheinlich wie nicht"
        wahrscheinlichkeit: "33-66%"
      unlikely:
        deutsch: "unwahrscheinlich"
        wahrscheinlichkeit: "0-33%"
      very_unlikely:
        deutsch: "sehr unwahrscheinlich"
        wahrscheinlichkeit: "0-10%"
      extremely_unlikely:
        deutsch: "äußerst unwahrscheinlich"
        wahrscheinlichkeit: "0-5%"

  konfidenz_begriffe:
    beschreibung: "Qualitative Konfidenz (Evidenz + Übereinstimmung)"
    stufen:
      very_high: "Sehr hohe Konfidenz"
      high: "Hohe Konfidenz"
      medium: "Mittlere Konfidenz"
      low: "Niedrige Konfidenz"
      very_low: "Sehr niedrige Konfidenz"
    faktoren:
      - "Menge der Evidenz"
      - "Übereinstimmung der Evidenz"


# =============================================================================
# KERNAUSSAGEN IPCC AR6
# =============================================================================

kernaussagen:

  erwaermung_eindeutig:
    aussage: "Die Erwärmung des Klimasystems ist eindeutig"
    IPCC_konfidenz: "unequivocal"
    evidenz:
      - "Globale Mitteltemperatur +1.1°C seit 1850-1900"
      - "Jede Dekade seit 1980 wärmer als alle vorherigen seit 1850"
      - "2011-2020 war die wärmste Dekade seit mind. 100.000 Jahren"
    quelle: "IPCC AR6 WG1, SPM A.1"
    konfidenz: 1.00

  menschlicher_einfluss:
    aussage: "Der menschliche Einfluss hat Atmosphäre, Ozean und Land erwärmt"
    IPCC_konfidenz: "unequivocal"
    evidenz:
      - "Fingerprint-Analysen"
      - "Attributionsstudien"
      - "Konsistenz mit physikalischem Verständnis"
    wissenschaftlicher_konsens: "97-99% der Klimawissenschaftler"
    quelle: "IPCC AR6 WG1, SPM A.1"
    konfidenz: 0.99

  hauptursache_co2:
    aussage: "CO₂-Anstieg ist hauptverantwortlich für die Erwärmung"
    IPCC_konfidenz: "virtually certain"
    beitrag: "1.0-2.0°C (best estimate: 1.5°C) von 1.1°C Erwärmung"
    aerosol_offset: "-0.0 bis -0.8°C (kühlend)"
    quelle: "IPCC AR6 WG1, SPM A.1.3"
    konfidenz: 0.99

  weitere_erwaermung:
    aussage: "Weitere Erwärmung ist unvermeidbar"
    IPCC_konfidenz: "virtually certain"
    projektionen_2100:
      SSP1_1.9: "1.0-1.8°C (best: 1.4°C)"
      SSP2_4.5: "2.1-3.5°C (best: 2.7°C)"
      SSP5_8.5: "3.3-5.7°C (best: 4.4°C)"
    quelle: "IPCC AR6 WG1, SPM B.1"
    konfidenz: 0.98


# =============================================================================
# KLIMAPHYSIK
# =============================================================================

klimaphysik:

  treibhauseffekt_physik:
    begriff: "Physik des Treibhauseffekts"
    mechanismus: |
      Treibhausgase absorbieren langwellige (IR) Strahlung der Erdoberfläche
      und emittieren sie in alle Richtungen, einschließlich zurück zur Erde.
      Dies erhöht die effektive Strahlungstemperatur.
    physikalische_grundlage:
      - "Planck'sches Strahlungsgesetz"
      - "Stefan-Boltzmann-Gesetz"
      - "Molekulare Absorption (IR-aktive Schwingungen)"
    erstmals_quantifiziert: "Arrhenius, 1896"
    experimentell_bestaetigt: true
    konfidenz: 1.00
    quelle: "Grundlagenphysik seit 19. Jahrhundert"

  strahlungsantrieb:
    begriff: "Strahlungsantrieb (Radiative Forcing)"
    symbol: "RF, ERF"
    definition: "Änderung der Strahlungsbilanz an der Tropopause"
    einheit: "W/m²"
    werte_seit_1750:
      gesamt_anthropogen: "+2.72 W/m² [1.96-3.48]"
      CO2: "+2.16 W/m² [1.90-2.41]"
      CH4: "+0.54 W/m² [0.43-0.65]"
      N2O: "+0.21 W/m² [0.18-0.24]"
      aerosole: "-1.1 W/m² [-0.4 to -1.8]"
    quelle: "IPCC AR6 WG1, Chapter 7"
    konfidenz: 0.95

  klimasensitivitaet:
    begriff: "Gleichgewichts-Klimasensitivität (ECS)"
    definition: "Erwärmung bei CO₂-Verdopplung im Gleichgewicht"
    best_estimate: "3°C"
    likely_range: "2.5-4.0°C"
    very_likely_range: "2.0-5.0°C"
    methoden:
      - "Paläoklima-Evidenz"
      - "Instrumentelle Periode"
      - "Prozessverständnis"
      - "Emergent Constraints"
    quelle: "IPCC AR6 WG1, Chapter 7"
    konfidenz: 0.90

  transient_response:
    begriff: "Transiente Klimaantwort (TCR)"
    definition: "Erwärmung bei CO₂-Verdopplung zum Zeitpunkt der Verdopplung"
    best_estimate: "1.8°C"
    likely_range: "1.4-2.2°C"
    anwendung: "Relevanter für kurzfristige Projektionen"
    quelle: "IPCC AR6 WG1"
    konfidenz: 0.92


# =============================================================================
# BEOBACHTETE VERÄNDERUNGEN
# =============================================================================

beobachtungen:

  temperaturanstieg:
    begriff: "Globaler Temperaturanstieg"
    wert: "+1.09°C [0.95-1.20] seit 1850-1900 (2011-2020)"
    rate:
      - "1901-2020: +0.08°C/Dekade"
      - "1970-2020: +0.18°C/Dekade"
      - "2000-2020: +0.20°C/Dekade"
    land_vs_ozean: "Land erwärmt sich ~1.6× schneller als Ozean"
    arktis: "Arktis erwärmt sich ~3-4× schneller (Arctic Amplification)"
    IPCC_konfidenz: "virtually certain"
    quelle: "IPCC AR6 WG1, SPM A.1.2"
    konfidenz: 0.99

  meeresspiegelanstieg:
    begriff: "Globaler Meeresspiegelanstieg"
    werte:
      seit_1900: "~0.20 m [0.15-0.25]"
      rate_1901_1971: "1.3 mm/Jahr"
      rate_1971_2006: "1.9 mm/Jahr"
      rate_2006_2018: "3.7 mm/Jahr"
    beschleunigung: "Beschleunigung ist very likely"
    ursachen:
      thermische_ausdehnung: "~50% seit 1971"
      eisverlust: "~50% seit 1971"
    quelle: "IPCC AR6 WG1, SPM A.1.7"
    konfidenz: 0.98

  eisverlust:
    begriff: "Globaler Eisverlust"
    gletscher:
      verlust_1990_2020: "~270 Gt/Jahr"
      projektion_2100: "Weiterer Verlust virtually certain"
    groenland:
      verlust_2006_2018: "~270 Gt/Jahr"
      beitrag_meeresspiegel: "~0.7 mm/Jahr"
    antarktis:
      verlust_2006_2018: "~150 Gt/Jahr"
      unsicherheit: "Größte Unsicherheit für Projektionen"
    arktisches_meereis:
      september_minimum: "-13%/Dekade seit 1979"
      eisfrei_sommer: "Praktisch eisfrei vor 2050 (SSP2-4.5+)"
    quelle: "IPCC AR6 WG1"
    konfidenz: 0.97

  co2_konzentration:
    begriff: "Atmosphärische CO₂-Konzentration"
    werte:
      aktuell_2024: "~422 ppm"
      vorindustriell: "280 ppm"
      anstieg: "+50% seit vorindustriell"
      rate: "+2.4 ppm/Jahr (2010-2019)"
    hoechststand: "Höchster Stand seit mindestens 2 Millionen Jahren"
    IPCC_konfidenz: "high confidence"
    quelle: "NOAA/Mauna Loa, IPCC AR6"
    konfidenz: 0.99


# =============================================================================
# ATTRIBUTION
# =============================================================================

attribution:

  attribution_wissenschaft:
    begriff: "Attributionswissenschaft"
    definition: |
      Wissenschaftliche Methoden zur Zuordnung von Klimaänderungen
      und Extremereignissen zu spezifischen Ursachen
    methoden:
      - "Detection and Attribution (D&A)"
      - "Fingerprint-Analysen"
      - "Probabilistic Event Attribution"
      - "Counterfactual Modeling"
    anwendung:
      - "Langfristige Trends"
      - "Einzelne Extremereignisse"
    quelle: "IPCC AR6 WG1, Chapter 3"
    konfidenz: 0.92

  anthropogener_anteil:
    begriff: "Anthropogener Anteil an der Erwärmung"
    wert: "100% [95-115%] der beobachteten Erwärmung"
    erklaerung: |
      Der anthropogene Beitrag (~1.1°C) übersteigt die beobachtete
      Erwärmung leicht, weil natürliche Faktoren leicht kühlend wirkten.
    natuerliche_faktoren:
      solare_variabilitaet: "~0.01°C"
      vulkane: "temporär kühlend"
    IPCC_konfidenz: "extremely likely (>95%)"
    quelle: "IPCC AR6 WG1, SPM A.1.3"
    konfidenz: 0.98

  extremereignis_attribution:
    begriff: "Attribution von Extremereignissen"
    beispiele:
      hitzewellen:
        erhoehung_wahrscheinlichkeit: "Faktor 2-10 typisch"
        intensitaet: "+1-3°C durch Klimawandel"
      starkniederschlag:
        erhoehung: "Häufigkeit und Intensität erhöht"
        clausius_clapeyron: "+7%/°C Wasserdampfkapazität"
      duerren:
        komplexer: "Regional unterschiedlich"
    world_weather_attribution: "Schnelle Attributionsstudien"
    konfidenz: 0.85


# =============================================================================
# PROJEKTIONEN
# =============================================================================

projektionen:

  temperaturprojektionen:
    begriff: "Temperaturprojektionen 2100"
    szenarien:
      SSP1_1.9:
        best_estimate: "1.4°C"
        likely_range: "1.0-1.8°C"
        beschreibung: "Starke Minderung, 1.5°C-kompatibel"
      SSP1_2.6:
        best_estimate: "1.8°C"
        likely_range: "1.3-2.4°C"
        beschreibung: "Nachhaltige Entwicklung"
      SSP2_4.5:
        best_estimate: "2.7°C"
        likely_range: "2.1-3.5°C"
        beschreibung: "Mittlerer Pfad"
      SSP3_7.0:
        best_estimate: "3.6°C"
        likely_range: "2.8-4.6°C"
        beschreibung: "Regionale Rivalität"
      SSP5_8.5:
        best_estimate: "4.4°C"
        likely_range: "3.3-5.7°C"
        beschreibung: "Hohe Emissionen, fossil-intensiv"
    quelle: "IPCC AR6 WG1, SPM B.1"
    konfidenz: 0.90

  meeresspiegelprojektionen:
    begriff: "Meeresspiegelprojektionen 2100"
    szenarien:
      SSP1_2.6:
        likely_range: "0.32-0.62 m"
        medium_confidence: true
      SSP2_4.5:
        likely_range: "0.44-0.76 m"
        medium_confidence: true
      SSP5_8.5:
        likely_range: "0.63-1.01 m"
        medium_confidence: true
    unsicherheit: |
      Eisschild-Instabilitäten könnten zu höheren Werten führen
      (low confidence für Werte >1m unter SSP5-8.5)
    irreversibilitaet: "Committed sea level rise over centuries"
    quelle: "IPCC AR6 WG1, SPM B.5"
    konfidenz: 0.85

  kipppunkte_risiko:
    begriff: "Risiko für Kipppunkte"
    bewertung: |
      Wahrscheinlichkeit für Überschreiten von Kipppunkten steigt
      mit zunehmender Erwärmung nicht-linear
    risiko_bei_1_5:
      AMOC: "Low risk"
      Groenland: "Low risk"
      Antarktis_West: "Low risk"
    risiko_bei_2_0:
      AMOC: "Medium risk"
      Groenland: "Medium risk"
      Amazonas: "Medium risk"
    risiko_bei_3_0_plus:
      alle: "High risk für mehrere Kipppunkte"
    quelle: "Armstrong McKay et al., Science 2022"
    konfidenz: 0.75


# =============================================================================
# KONTROVERSE UND UNSICHERHEITEN
# =============================================================================

unsicherheiten:

  hauptunsicherheiten:
    - kategorie: "Klimasensitivität"
      range: "2.5-4.0°C (likely)"
      ursache: "Cloud Feedbacks"

    - kategorie: "Aerosol-Forcing"
      range: "-0.4 bis -1.8 W/m²"
      ursache: "Indirekte Effekte auf Wolken"

    - kategorie: "Eisschild-Dynamik"
      implikation: "Unsicherheit für Meeresspiegelanstieg >2100"
      ursache: "Marine Ice Sheet Instability"

    - kategorie: "Kohlenstoff-Feedbacks"
      implikation: "Permafrost, Waldsterben"
      ursache: "Komplexe Biosphären-Interaktionen"

  falsche_kontroversen:
    - behauptung: "Erwärmung ist nicht menschgemacht"
      status: "Widerlegt"
      wissenschaftlicher_konsens: "97-99%"

    - behauptung: "Modelle sind unzuverlässig"
      status: "Falsch"
      evidenz: "Modelle reproduzieren beobachtete Trends"

    - behauptung: "Es gab früher auch warme Zeiten"
      status: "Korrekt aber irreführend"
      kontext: "Rate der Erwärmung ist beispiellos"
