# =============================================================================
# VALIDIERUNG: Empirical System of Language (ESL)
# =============================================================================
# Datum: Dezember 2024
# Methode: MQC-Framework + Interne Konsistenzprüfung
# =============================================================================

# =============================================================================
# TEIL 1: INTERNE KONSISTENZ - Erfüllt ESL seine eigenen Kriterien?
# =============================================================================

interne_konsistenz:

  meta_frage: |
    Das ESL postuliert: Wissenschaftliche Aussagen sollen kalibriert sein (K ≥ 0.8).
    Frage: Erfüllt das ESL-Dokument selbst diesen Standard?

  analyse_kernaussagen:

    aussage_1:
      text: "K = 1 - |B-E|/B_max quantifiziert die empirische Deckung einer Aussage"
      B_geschaetzt: 0.95  # Starke Behauptung
      E_vorhanden:
        - "Keine empirische Validierung der Formel"
        - "Keine Studie die zeigt dass K mit Replikabilität korreliert"
        - "Keine Inter-Rater-Reliabilität für B und E Messung"
      E_geschaetzt: 0.20
      K_berechnet: 0.21  # (1 - |0.95-0.20|/1.0)
      bewertung: "🔴 INSTABIL nach eigenen Kriterien"

    aussage_2:
      text: "K ≥ 0.8 = empirisch stabil = wissenschaftlich wahr"
      B_geschaetzt: 0.90
      E_vorhanden:
        - "Schwellenwert ist normative Setzung (im Text selbst zugegeben)"
        - "Keine empirische Basis für 0.8 vs 0.7 vs 0.9"
      E_geschaetzt: 0.15
      K_berechnet: 0.17
      bewertung: "🔴 INSTABIL - Schwellenwert nicht kalibriert"

    aussage_3:
      text: "LLMs ermöglichen erstmals die technische Umsetzung empirischer Sprachmessung"
      B_geschaetzt: 0.85
      E_vorhanden:
        - "LLMs existieren ✓"
        - "LLMs können Text analysieren ✓"
        - "ABER: Keine Studie zeigt dass LLM-Output = valide B/E-Messung"
        - "ABER: Halluzinationsproblem nicht gelöst"
      E_geschaetzt: 0.40
      K_berechnet: 0.47
      bewertung: "🟠 TEILSTABIL - Technologie ja, Validierung nein"

    aussage_4:
      text: "Klimaforschung-Beispiel zeigt K-Werte für konkrete Aussagen"
      B_geschaetzt: 0.80
      E_vorhanden:
        - "Werte sind postuliert, nicht gemessen"
        - "Keine Methodik wie B=0.95 für 'Mensch verursacht Temperaturanstieg' ermittelt wurde"
        - "Woher kommt E=0.92?"
      E_geschaetzt: 0.10
      K_berechnet: 0.13
      bewertung: "🔴 INSTABIL - Beispiel ist Illustration, nicht Empirie"

  zusammenfassung_intern:
    durchschnitt_K: 0.25
    eigene_schwelle: 0.80
    erfuellt: false
    fazit: |
      Das ESL erfüllt seine eigenen Kriterien NICHT.
      Die Kernaussagen haben K-Werte von 0.13-0.47, weit unter dem
      postulierten Schwellenwert von 0.80.

      Dies ist kein Argument GEGEN das ESL, sondern zeigt:
      Das ESL ist aktuell ein KONZEPT (K < 0.6), keine validierte Theorie (K ≥ 0.8).

# =============================================================================
# TEIL 2: KRITISCHE LÜCKEN
# =============================================================================

kritische_luecken:

  luecke_1:
    name: "Operationalisierung von B"
    frage: "Wie wird Behauptungsstärke gemessen?"
    im_dokument: "Nicht spezifiziert"
    beispiel_problem: |
      "Der Mensch verursacht den Temperaturanstieg" hat B=0.95
      "Extremwetter wird weltweit zunehmen" hat B=0.85

      ABER: Warum 0.95 vs 0.85? Wer entscheidet? Nach welchen Kriterien?

    loesung_noetig:
      - "Lexikon für Modalverben → B-Werte (muss=0.95, könnte=0.5)"
      - "Inter-Rater-Reliabilität testen"
      - "Automatisierte B-Extraktion via LLM kalibrieren"

  luecke_2:
    name: "Operationalisierung von E"
    frage: "Wie wird Evidenzstärke gemessen?"
    im_dokument: "Nicht spezifiziert"
    beispiel_problem: |
      Woher kommt E=0.92 für "Mensch verursacht Temperaturanstieg"?
      - Anzahl Studien? (aber: 1000 schlechte Studien ≠ hohe E)
      - Meta-Analysen? (aber: welche Gewichtung?)
      - Konsens? (aber: Konsens ≠ Evidenz)

    loesung_noetig:
      - "Evidenzhierarchie definieren (wie MA-EPI-38 im BCM)"
      - "Mapping: Studientyp → E-Wert"
      - "Aggregationsmethode für multiple Studien"

  luecke_3:
    name: "Kalibrierung der Schwellenwerte"
    frage: "Warum K ≥ 0.8 für 'stabil'?"
    im_dokument: "Als normative Setzung bezeichnet"
    problem: |
      Das ESL kritisiert unkalibrierte Wissenschaftssprache,
      verwendet aber selbst unkalibrierte Schwellenwerte.

      → Performativer Widerspruch

    loesung_noetig:
      - "Empirische Validierung: Korreliert K mit Replikabilität?"
      - "Gold-Standard-Texte bewerten, Schwellen ableiten"
      - "Unsicherheit der Schwellen quantifizieren"

  luecke_4:
    name: "Komplementaritätswerte δ"
    frage: "Woher kommen δ = +0.3, +0.4?"
    im_dokument: "Postuliert ohne Herleitung"
    problem: |
      Die Komplementaritätsmatrix ist zentral für die Gesamtkohärenz,
      aber die Werte sind aus der Luft gegriffen.

    loesung_noetig:
      - "Empirische Messung an realen Texten"
      - "Oder: explizit als Hypothese kennzeichnen"

  luecke_5:
    name: "LLM-Validierung"
    frage: "Kann ein LLM B und E valide messen?"
    im_dokument: "Angenommen, aber nicht gezeigt"
    problem: |
      LLMs als "empirische Sensoren" ist eine starke Behauptung.
      - LLMs halluzinieren
      - LLMs reflektieren Trainingskorpus, nicht "Wahrheit"
      - Keine Studie zeigt: LLM-B ≈ Human-B

    loesung_noetig:
      - "Benchmark: LLM vs. Experten für B/E-Schätzung"
      - "Halluzinationsrate für ESL-Aufgaben messen"
      - "Prompt-Engineering für ESL-Aufgaben dokumentieren"

# =============================================================================
# TEIL 3: STÄRKEN DES KONZEPTS
# =============================================================================

staerken:

  staerke_1:
    name: "Wichtiges Problem adressiert"
    beschreibung: |
      Die Replikationskrise zeigt: Es gibt eine Lücke zwischen
      Behauptung und Evidenz in der Wissenschaft.
      ESL adressiert dieses Problem explizit.

  staerke_2:
    name: "Formalisierung"
    beschreibung: |
      Die Kalibrierungsfunktion K ist klar definiert.
      Das ermöglicht Kritik und Weiterentwicklung.

  staerke_3:
    name: "Ebenenstruktur"
    beschreibung: |
      Die 5-Ebenen-Architektur (Nano-Makro) ist plausibel
      und kompatibel mit linguistischer Theorie.

  staerke_4:
    name: "Verbindung zu BCM"
    beschreibung: |
      Die Parallelität zu BCM (beide: Kalibrierung, Ebenen, Dynamik)
      schafft konzeptuelle Kohärenz im Gesamtsystem.

  staerke_5:
    name: "Selbstkritik"
    beschreibung: |
      Das Dokument benennt selbst Grenzen (LLM-Limitationen,
      normative Schwellenwerte, Selbstreferenz).

# =============================================================================
# TEIL 4: EMPFEHLUNGEN
# =============================================================================

empfehlungen:

  empfehlung_1:
    prioritaet: "HOCH"
    was: "B-Operationalisierung definieren"
    wie:
      - "Modalverb-Lexikon erstellen (muss/soll/kann/könnte → B-Werte)"
      - "Quantor-Mapping (alle/viele/einige → B-Werte)"
      - "Inter-Rater-Reliabilität messen"

  empfehlung_2:
    prioritaet: "HOCH"
    was: "E-Operationalisierung definieren"
    wie:
      - "Evidenzhierarchie analog MA-EPI-38"
      - "Studientyp → E-Basiswert"
      - "Aggregationsmethode für multiple Quellen"

  empfehlung_3:
    prioritaet: "HOCH"
    was: "Schwellenwerte kalibrieren"
    wie:
      - "Gold-Standard-Korpus erstellen (replizierte vs. nicht-replizierte Studien)"
      - "K-Werte berechnen"
      - "Schwellen empirisch ableiten"
      - "Konfidenzintervalle angeben"

  empfehlung_4:
    prioritaet: "MITTEL"
    was: "LLM-Validierung durchführen"
    wie:
      - "Human-Benchmark für B/E-Schätzung"
      - "LLM vs. Human Korrelation messen"
      - "Prompt-Varianten testen"

  empfehlung_5:
    prioritaet: "MITTEL"
    was: "Selbstanwendung dokumentieren"
    wie:
      - "ESL-Dokument mit ESL bewerten"
      - "K-Werte für eigene Aussagen berechnen"
      - "Transparent als 'Konzept' (K < 0.6) labeln"

  empfehlung_6:
    prioritaet: "NIEDRIG"
    was: "Komplementaritätswerte empirisch validieren"
    wie:
      - "Textkorpus analysieren"
      - "Korrelationen zwischen Ebenen messen"
      - "δ-Werte ableiten statt postulieren"

# =============================================================================
# TEIL 5: GESAMTBEWERTUNG
# =============================================================================

gesamtbewertung:

  status: "VIELVERSPRECHENDES KONZEPT - NICHT VALIDIERT"

  nach_esl_eigenen_kriterien:
    K_durchschnitt: 0.25
    kategorie: "interpretativ / spekulativ"
    fazit: "ESL ist aktuell Theorie-Entwurf, nicht Theorie"

  nach_mqc_kriterien:
    D01_wissenschaft: 0.40  # Quellen gut, aber keine empirische Validierung
    D02_bcm_spezifik: 0.70  # Gute Parallelität zu BCM
    D03_didaktik: 0.75      # Klare Struktur, gute Beispiele
    D04_anwendbarkeit: 0.30 # Nicht umsetzbar ohne B/E-Operationalisierung
    D07_epistemische_reflexion: 0.60  # Grenzen benannt, aber nicht quantifiziert
    D08_validierung: 0.15   # Keine empirische Validierung
    D13_meta_reflexivitaet: 0.50  # Selbstkritik ja, Selbstanwendung nein

    gewichteter_score: 0.48
    bewertung: "🟠 Verbesserungswürdig"

  kernaussage: |
    Das ESL ist ein interessantes Konzept mit klarer Formalisierung,
    aber es erfüllt weder seine eigenen Kriterien (K ≥ 0.8) noch
    externe Wissenschaftsstandards.

    Das ist KEIN Argument gegen das Konzept, sondern eine
    Einordnung seines aktuellen Status:

    ┌─────────────────────────────────────────────────────┐
    │  ESL Status: HYPOTHESE / KONZEPT                   │
    │                                                     │
    │  Nicht: Validierte Theorie                         │
    │  Nicht: Anwendbares Framework                      │
    │                                                     │
    │  Sondern: Forschungsprogramm mit offenem Ausgang   │
    └─────────────────────────────────────────────────────┘

  naechste_schritte:
    1: "B-Operationalisierung (KRITISCH)"
    2: "E-Operationalisierung (KRITISCH)"
    3: "Pilotvalidierung an 10-20 Texten"
    4: "Schwellenwerte empirisch kalibrieren"
    5: "LLM-Pipeline entwickeln und validieren"

  meta_ironie: |
    Diese Validierung selbst folgt dem ESL-Prinzip:
    Sie macht die Diskrepanz zwischen Behauptung und Evidenz im ESL explizit.

    Das ESL ist damit ein selbstreferentielles System:
    Es fordert Kalibrierung und wird selbst durch Kalibrierung kritisiert.

    Das ist wissenschaftlich gesund.
